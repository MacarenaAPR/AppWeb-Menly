{% extends "admin/base_site.html" %}

{% block content %}
  <h1>Importar productos desde CSV</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="default">
      Importar CSV
    </button>
  </form>

  <br>

  <a href="../">Volver a productos</a>
{% endblock %}
